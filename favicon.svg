<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-label="Atlas">
  <!-- Dark medallion so the light needle stays visible on light OR dark browser tabs -->
  <circle cx="24" cy="24" r="23.5" fill="#050608"/>
  <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(255,255,255,0.20)" stroke-width="1"/>
  <!-- Compass rose -->
  <polygon points="24,4 27.5,22 24,24 20.5,22" fill="#A7B5E8"/>            <!-- N — brand accent -->
  <polygon points="24,44 27.5,26 24,24 20.5,26" fill="rgba(255,255,255,0.30)"/> <!-- S -->
  <polygon points="44,24 26,20.5 24,24 26,27.5" fill="rgba(255,255,255,0.30)"/> <!-- E -->
  <polygon points="4,24 22,27.5 24,24 22,20.5" fill="rgba(255,255,255,0.30)"/>  <!-- W -->
  <!-- Center jewel -->
  <circle cx="24" cy="24" r="3.2" fill="#050608" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  <circle cx="24" cy="24" r="1.3" fill="#ffffff"/>
</svg>
